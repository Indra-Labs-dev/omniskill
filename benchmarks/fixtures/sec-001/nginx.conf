server {
    listen 80;
    server_name app.example.com;
    server_tokens on;
    autoindex on;
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
    location /admin {
        proxy_pass http://127.0.0.1:8080/admin;
    }
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    add_header X-Frame-Options SAMEORIGIN;
}
